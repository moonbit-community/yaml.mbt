name: check

on:
  push:
    branches:
      - main   
  pull_request:
  # a toolchain update can change `moon fmt`/`moon info` output with no push
  # to this repository, so check main weekly as well
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    strategy:    
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: moon update
        run: |
          moon update

      - name: moon check
        run: moon check --deny-warn --target all

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code
      
      - name: info diff
        run: |
          moon info
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all